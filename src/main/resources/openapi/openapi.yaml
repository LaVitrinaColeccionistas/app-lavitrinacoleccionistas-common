openapi: 3.0.3
info:
  title: LaVitrinaColeccionistas - Commons
  version: 0.0.1-SNAPSHOT
  description: DTOs compartidos generados a partir de las entities del modelo de datos.

paths:

  /roles:
    get:
      summary: Listar roles
      operationId: listarRoles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolDTO'
    post:
      summary: Crear rol
      operationId: crearRol
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolCreateDTO'
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolDTO'

  /roles/{id}:
    get:
      summary: Obtener rol por id
      operationId: obtenerRol
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolDTO'
        '404':
          description: No encontrado

  /usuarios:
    get:
      summary: Listar usuarios
      operationId: listarUsuarios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioDTO'
    post:
      summary: Registrar usuario
      operationId: crearUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreateDTO'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'

  /usuarios/{id}:
    get:
      summary: Obtener usuario por id
      operationId: obtenerUsuario
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '404':
          description: No encontrado
    put:
      summary: Actualizar usuario
      operationId: actualizarUsuario
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdateDTO'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'

  /productos:
    get:
      summary: Listar productos
      operationId: listarProductos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoDTO'
    post:
      summary: Crear producto
      operationId: crearProducto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCreateDTO'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDTO'

  /productos/{id}:
    get:
      summary: Obtener producto por id
      operationId: obtenerProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDTO'
        '404':
          description: No encontrado

  /publicaciones:
    get:
      summary: Listar publicaciones
      operationId: listarPublicaciones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicacionDTO'
    post:
      summary: Crear publicacion
      operationId: crearPublicacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionCreateDTO'
      responses:
        '201':
          description: Publicacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDTO'

  /publicaciones/{id}:
    get:
      summary: Obtener publicacion por id
      operationId: obtenerPublicacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDTO'
        '404':
          description: No encontrado

  /publicaciones/{idPublicacion}/detalles:
    get:
      summary: Listar detalles de una publicacion
      operationId: listarDetallesPublicacion
      parameters:
        - name: idPublicacion
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetallePublicacionDTO'
    post:
      summary: Agregar detalle a una publicacion
      operationId: crearDetallePublicacion
      parameters:
        - name: idPublicacion
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetallePublicacionCreateDTO'
      responses:
        '201':
          description: Detalle creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetallePublicacionDTO'

  /ofertas:
    get:
      summary: Listar ofertas
      operationId: listarOfertas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfertaDTO'
    post:
      summary: Crear oferta
      operationId: crearOferta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaCreateDTO'
      responses:
        '201':
          description: Oferta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'

  /ofertas/{id}:
    get:
      summary: Obtener oferta por id
      operationId: obtenerOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '404':
          description: No encontrado

  /ofertas/{id}/aceptar:
    post:
      summary: Aceptar una oferta
      operationId: aceptarOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Oferta aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '404':
          description: No encontrado

  /ofertas/{id}/rechazar:
    post:
      summary: Rechazar una oferta
      operationId: rechazarOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Oferta rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '404':
          description: No encontrado

  # MS2 - ORDENES DE COMPRA

  /ordenes:
    get:
      summary: Listar ordenes de compra
      operationId: listarOrdenes
      parameters:
        - name: idComprador
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: estadoOrden
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoOrden'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdenCompraDTO'
    post:
      summary: Crear orden de compra
      operationId: crearOrden
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenCompraCreateDTO'
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'

  /ordenes/{id}:
    get:
      summary: Obtener orden de compra por id
      operationId: obtenerOrden
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
        '404':
          description: No encontrado

  /ordenes/{id}/estado:
    patch:
      summary: Actualizar el estado de una orden
      operationId: actualizarEstadoOrden
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenCompraEstadoUpdateDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
        '404':
          description: No encontrado

  /ordenes/{idOrden}/detalles:
    get:
      summary: Listar detalles de una orden de compra
      operationId: listarDetallesOrden
      parameters:
        - name: idOrden
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetalleOrdenCompraDTO'
    post:
      summary: Agregar detalle a una orden de compra
      operationId: crearDetalleOrden
      parameters:
        - name: idOrden
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetalleOrdenCompraCreateDTO'
      responses:
        '201':
          description: Detalle creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleOrdenCompraDTO'

  # MS3 - INTERCAMBIOS
  /intercambios:
    get:
      summary: Listar intercambios
      operationId: listarIntercambios
      parameters:
        - name: idUsuario
          in: query
          required: false
          description: Filtra por usuario proponente o receptor
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntercambioDTO'
    post:
      summary: Proponer un intercambio
      operationId: crearIntercambio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntercambioCreateDTO'
      responses:
        '201':
          description: Intercambio creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'

  /intercambios/{id}:
    get:
      summary: Obtener intercambio por id
      operationId: obtenerIntercambio
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'
        '404':
          description: No encontrado

  /intercambios/{id}/estado:
    patch:
      summary: Actualizar el estado de un intercambio
      operationId: actualizarEstadoIntercambio
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntercambioEstadoUpdateDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'
        '404':
          description: No encontrado

  /intercambios/{idIntercambio}/detalles:
    get:
      summary: Listar detalles de un intercambio
      operationId: listarDetallesIntercambio
      parameters:
        - name: idIntercambio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetalleIntercambioDTO'
    post:
      summary: Agregar detalle a un intercambio
      operationId: crearDetalleIntercambio
      parameters:
        - name: idIntercambio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetalleIntercambioCreateDTO'
      responses:
        '201':
          description: Detalle creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleIntercambioDTO'
  /tickets-soporte:
    post:
      summary: Crear ticket de soporte
      operationId: crearTicketSoporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketSoporteCreateDTO'
      responses:
        '201':
          description: Ticket de soporte creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSoporteDTO'

components:

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:

    # ROL
    RolDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipoRol:
          type: string
          enum: [COMPRADOR, VENDEDOR, ADMIN]
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    RolCreateDTO:
      type: object
      required: [tipoRol]
      properties:
        tipoRol:
          type: string
          enum: [COMPRADOR, VENDEDOR, ADMIN]

    # USUARIO
    UsuarioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        estado:
          type: string
          enum: [ACTIVO, SUSPENDIDO, PENDIENTE_VERIFICACION, RECHAZADO]
        rol:
          $ref: '#/components/schemas/RolDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    UsuarioCreateDTO:
      type: object
      required: [email, password, idRol]
      properties:
        email:
          type: string
        password:
          type: string
        idRol:
          type: integer
          format: int64

    UsuarioUpdateDTO:
      type: object
      properties:
        email:
          type: string
        estado:
          type: string
          enum: [ACTIVO, SUSPENDIDO, PENDIENTE_VERIFICACION, RECHAZADO]

    # PERFIL USUARIO
    PerfilUsuarioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idUsuario:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccionEnvio:
          type: string

    PerfilUsuarioCreateDTO:
      type: object
      required: [ idUsuario, nombre, apellido ]
      properties:
        idUsuario:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccionEnvio:
          type: string

    PerfilUsuarioUpdateDTO:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccionEnvio:
          type: string

    # PRODUCTO
    ProductoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idVendedor:
          type: integer
          format: int64
        nombre:
          type: string
        categoria:
          type: string
        estadoConservacion:
          type: string
        rareza:
          type: string
        stock:
          type: integer
        precioReferencia:
          type: number
          format: double
        urlImagen:
          type: string
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    ProductoCreateDTO:
      type: object
      required: [idVendedor, nombre, precioReferencia]
      properties:
        idVendedor:
          type: integer
          format: int64
        nombre:
          type: string
        categoria:
          type: string
        estadoConservacion:
          type: string
        rareza:
          type: string
        stock:
          type: integer
        precioReferencia:
          type: number
          format: double
        urlImagen:
          type: string

    # PUBLICACION
    PublicacionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idVendedor:
          type: integer
          format: int64
        titulo:
          type: string
        descripcion:
          type: string
        tipoVenta:
          type: string
          enum: [PRECIO_FIJO, OFERTA_LIBRE]
        estadoPublicacion:
          type: string
          enum: [ACTIVA, PAUSADA, VENDIDA, CANCELADA]
        fechaPublicacion:
          type: string
          format: date-time
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    PublicacionCreateDTO:
      type: object
      required: [idVendedor, titulo, tipoVenta]
      properties:
        idVendedor:
          type: integer
          format: int64
        titulo:
          type: string
        descripcion:
          type: string
        tipoVenta:
          type: string
          enum: [PRECIO_FIJO, OFERTA_LIBRE]

    # DETALLE PUBLICACION
    DetallePublicacionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        producto:
          $ref: '#/components/schemas/ProductoDTO'
        precioUnitario:
          type: number
          format: double
        cantidadPublicada:
          type: integer

    DetallePublicacionCreateDTO:
      type: object
      required: [idProducto, precioUnitario, cantidadPublicada]
      properties:
        idProducto:
          type: integer
          format: int64
        precioUnitario:
          type: number
          format: double
        cantidadPublicada:
          type: integer

    # OFERTA
    OfertaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        montoOfertado:
          type: number
          format: double
        estadoOferta:
          type: string
          enum: [PENDIENTE, ACEPTADA, RECHAZADA, EXPIRADA]
        fechaOferta:
          type: string
          format: date-time
        fechaRespuesta:
          type: string
          format: date-time

    OfertaCreateDTO:
      type: object
      required: [idPublicacion, idComprador, montoOfertado]
      properties:
        idPublicacion:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        montoOfertado:
          type: number
          format: double

    # MS2 - ORDEN DE COMPRA

    EstadoOrden:
      type: string
      enum: [PENDIENTE, PAGADA, ENVIADA, ENTREGADA, CANCELADA]

    MetodoPago:
      type: string
      enum: [TARJETA, EFECTIVO, TRANSFERENCIA]

    OrdenCompraDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        fechaOrden:
          type: string
          format: date-time
        estadoOrden:
          $ref: '#/components/schemas/EstadoOrden'
        montoSubtotal:
          type: number
          format: double
        costoEnvio:
          type: number
          format: double
        montoTotal:
          type: number
          format: double
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleOrdenCompraDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    OrdenCompraCreateDTO:
      type: object
      required: [idComprador, metodoPago, detalles]
      properties:
        idComprador:
          type: integer
          format: int64
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'
        costoEnvio:
          type: number
          format: double
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleOrdenCompraCreateDTO'

    OrdenCompraEstadoUpdateDTO:
      type: object
      required: [estadoOrden]
      properties:
        estadoOrden:
          $ref: '#/components/schemas/EstadoOrden'

    # DETALLE ORDEN DE COMPRA
    DetalleOrdenCompraDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idOrden:
          type: integer
          format: int64
        idProducto:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        nombreProductoSnapshot:
          type: string
        cantidad:
          type: integer
        precioUnitarioHistorico:
          type: number
          format: double
        subtotalItem:
          type: number
          format: double

    DetalleOrdenCompraCreateDTO:
      type: object
      required: [idProducto, idPublicacion, cantidad]
      properties:
        idProducto:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        cantidad:
          type: integer

    # MS3 - INTERCAMBIO

    EstadoIntercambio:
      type: string
      enum: [PROPUESTO, ACEPTADO, RECHAZADO, CANCELADO, COMPLETADO]

    TipoMovimientoIntercambio:
      type: string
      enum: [OFRECIDO, SOLICITADO]

    IntercambioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idUsuarioProponente:
          type: integer
          format: int64
        idUsuarioReceptor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoIntercambio'
        diferenciaDinero:
          type: number
          format: double
        usuarioPagaDiferencia:
          type: integer
          format: int64
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleIntercambioDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    IntercambioCreateDTO:
      type: object
      required: [idUsuarioProponente, idUsuarioReceptor, detalles]
      properties:
        idUsuarioProponente:
          type: integer
          format: int64
        idUsuarioReceptor:
          type: integer
          format: int64
        diferenciaDinero:
          type: number
          format: double
        usuarioPagaDiferencia:
          type: integer
          format: int64
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleIntercambioCreateDTO'

    IntercambioEstadoUpdateDTO:
      type: object
      required: [estado]
      properties:
        estado:
