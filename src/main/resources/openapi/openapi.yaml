openapi: 3.0.3
info:
  title: LaVitrinaColeccionistas - Commons
  version: 0.0.1-SNAPSHOT
  description: DTOs compartidos generados a partir de las entities del modelo de datos.

tags:
  - name: Auth
    description: Autenticación y validación de tokens
  - name: Roles
    description: Gestión de roles de usuario
  - name: Usuarios
    description: Registro y administración de usuarios
  - name: Productos
    description: Catálogo de productos
  - name: Publicaciones
    description: Publicaciones de venta
  - name: Ofertas
    description: Ofertas sobre publicaciones
  - name: Ordenes
    description: Órdenes de compra (MS2)
  - name: Intercambios
    description: Intercambios entre usuarios (MS3)
  - name: Soporte
    description: Tickets de soporte

paths:

  /roles:
    get:
      tags: [Roles]
      summary: Listar roles
      operationId: listarRoles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolDTO'
    post:
      tags: [Roles]
      summary: Crear rol
      operationId: crearRol
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolCreateDTO'
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolDTO'

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Obtener rol por id
      operationId: obtenerRol
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolDTO'
        '404':
          description: No encontrado

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDTO'
        '400':
          description: Datos inválidos
        '401':
          description: Credenciales inválidas

  /auth/validate:
    post:
      tags: [Auth]
      summary: Validar un token
      operationId: validarToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarTokenDTO'
      responses:
        '200':
          description: Token válido, devuelve sus claims
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Token inválido o expirado

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (paginado)
      operationId: listarUsuarios
      parameters:
        - name: email
          in: query
          required: false
          description: Búsqueda parcial por email
          schema:
            type: string
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPageDTO'
        '401':
          description: Token ausente o inválido
        '403':
          description: Requiere rol ADMIN
    post:
      tags: [Usuarios]
      summary: Registrar usuario
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreateDTO'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '400':
          description: Datos inválidos
        '401':
          description: Token ausente o inválido
        '403':
          description: Requiere rol ADMIN
        '404':
          description: Algún rol no existe
        '409':
          description: El email ya está registrado

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por id
      operationId: obtenerUsuario
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '401':
          description: Token ausente o inválido
        '403':
          description: Requiere rol ADMIN
        '404':
          description: No encontrado
    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      operationId: actualizarUsuario
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdateDTO'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '400':
          description: Datos inválidos
        '401':
          description: Token ausente o inválido
        '403':
          description: Requiere rol ADMIN
        '404':
          description: Usuario o rol no encontrado
        '409':
          description: El email ya está registrado
    delete:
      tags: [Usuarios]
      summary: Baja lógica de un usuario (estado SUSPENDIDO)
      operationId: eliminarUsuario
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuario suspendido
        '401':
          description: Token ausente o inválido
        '403':
          description: Requiere rol ADMIN
        '404':
          description: No encontrado

  /productos:
    get:
      tags: [Productos]
      summary: Listar y buscar productos
      operationId: listarProductos
      parameters:
        - name: nombre
          in: query
          required: false
          description: Búsqueda parcial por nombre
          schema:
            type: string
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: rareza
          in: query
          required: false
          schema:
            type: string
        - name: idVendedor
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: OK, pagina de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPageDTO'
        '400':
          description: Parametros de busqueda o paginacion invalidos
        '500':
          description: Error interno del servidor

    post:
      tags: [Productos]
      summary: Crear producto
      operationId: crearProducto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCreateDTO'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDTO'
        '400':
          description: Datos invalidos, idVendedor, nombre y precioReferencia son obligatorios
        '500':
          description: Error interno del servidor

  /productos/{id}:
    get:
      tags: [Productos]
      summary: Obtener producto por id
      operationId: obtenerProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDTO'
        '404':
          description: Producto no encontrado o inactivo
        '500':
          description: Error interno del servido

    put:
      tags: [Productos]
      summary: Actualizar producto
      operationId: actualizarProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoUpdateDTO'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDTO'
        '400':
          description: Datos invalidos
        '404':
          description: Producto no encontrado o inactivo
        '500':
          description: Error interno del servidor

    delete:
      tags: [Productos]
      summary: Eliminar lógicamente un producto
      operationId: eliminarProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Producto eliminado lógicamente
        '404':
          description: Producto no encontrado o inactivo
        '500':
          description: Error interno del servidor


  /publicaciones:
    get:
      tags: [Publicaciones]
      summary: Listar y buscar publicaciones (paginado)
      operationId: listarPublicaciones
      parameters:
        - name: titulo
          in: query
          required: false
          description: Búsqueda parcial por título
          schema:
            type: string
        - name: idVendedor
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: estadoPublicacion
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoPublicacion'
        - name: tipoVenta
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoVenta'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Página de publicaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionPageDTO'
    post:
      tags: [Publicaciones]
      summary: Crear publicacion
      description: Crea la cabecera y los detalles
      operationId: crearPublicacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionCreateDTO'
      responses:
        '201':
          description: Publicacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDTO'
        '400':
          description: Datos invalidos
        '404':
          description: Algun producto no existe o esta inactivo
        '409':
          description: Producto repetido, de otro vendedor o con stock insuficiente
        '500':
          description: Error interno del servidor

  /publicaciones/{id}:
    get:
      tags: [Publicaciones]
      summary: Obtener publicacion por id
      operationId: obtenerPublicacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDTO'
        '404':
          description: No encontrado
    put:
      tags: [Publicaciones]
      summary: Actualizar publicacion y sus detalles
      description: Actualiza la cabecera y reemplaza los detalles en una sola transacción.
      operationId: actualizarPublicacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionUpdateDTO'
      responses:
        '200':
          description: Publicacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDTO'
        '400':
          description: Datos invalidos
        '404':
          description: Publicacion o producto no encontrado
        '409':
          description: Producto repetido, de otro vendedor o con stock insuficiente
        '500':
          description: Error interno del servidor

    delete:
      tags: [Publicaciones]
      summary: Eliminar lógicamente una publicacion
      description: Borrado lógico. Marca la publicación como CANCELADA; no elimina el registro.
      operationId: eliminarPublicacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Eliminado lógicamente
        '404':
          description: No encontrado

  /publicaciones/{id}/estado:
    patch:
      tags: [Publicaciones]
      summary: Actualizar el estado de una publicacion
      description: No permite cambiar el estado de una publicación CANCELADA (eliminada lógicamente); responde 409.
      operationId: actualizarEstadoPublicacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionEstadoUpdateDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDTO'
        '400':
          description: Estado invalido
        '404':
          description: No encontrado
        '409':
          description: La publicación está CANCELADA y no admite cambios de estado
        '500':
          description: Error interno del servidor


  /publicaciones/{idPublicacion}/detalles:
    get:
      tags: [Publicaciones]
      summary: Listar detalles de una publicacion (paginado)
      operationId: listarDetallesPublicacion
      parameters:
        - name: idPublicacion
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Página de detalles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetallePublicacionPageDTO'

  /ofertas:
    get:
      tags: [Ofertas]
      summary: Listar y buscar ofertas (paginado)
      operationId: listarOfertas
      parameters:
        - name: idPublicacion
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: idComprador
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: estadoOferta
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoOferta'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Página de ofertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaPageDTO'
        '400':
          description: Parametros de busqueda o paginacion invalidos
        '500':
          description: Error interno del servidor

    post:
      tags: [Ofertas]
      summary: Crear oferta
      operationId: crearOferta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaCreateDTO'
      responses:
        '201':
          description: Oferta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '400':
          description: Datos invalidos, idPublicacion, idComprador y montoOfertado son obligatorios
        '404':
          description: La publicacion no existe o esta cancelada
        '409':
          description: La publicacion no esta activa o el vendedor ofertando en su propia publicacion
        '500':
          description: Error interno del servidor

  /ofertas/{id}:
    get:
      tags: [Ofertas]
      summary: Obtener oferta por id
      operationId: obtenerOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '404':
          description: Oferta no encontrada
        '500':
          description: Error interno del servidor

    put:
      tags: [Ofertas]
      summary: Actualizar oferta
      operationId: actualizarOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaUpdateDTO'
      responses:
        '200':
          description: Oferta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '400':
          description: Datos invalidos
        '404':
          description: Oferta no encontrada
        '409':
          description: La oferta no esta PENDIENTE
        '500':
          description: Error interno del servidor

    delete:
      tags: [Ofertas]
      summary: Eliminar lógicamente una oferta
      operationId: eliminarOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Eliminado lógicamente
        '404':
          description: No encontrado

  /ofertas/{id}/aceptar:
    post:
      tags: [Ofertas]
      summary: Aceptar una oferta
      operationId: aceptarOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Oferta aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '404':
          description: Oferta no encontrada
        '409':
          description: La oferta no esta PENDIENTE
        '500':
          description: Error interno del servidor


  /ofertas/{id}/rechazar:
    post:
      tags: [Ofertas]
      summary: Rechazar una oferta
      operationId: rechazarOferta
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Oferta rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDTO'
        '404':
          description: Oferta no encontrada
        '409':
          description: La oferta no esta PENDIENTE
        '500':
          description: Error interno del servidor
          
  # MS2 - ORDENES DE COMPRA

  /ordenes:
    get:
      tags: [Ordenes]
      summary: Listar ordenes de compra
      operationId: listarOrdenes
      parameters:
        - name: idComprador
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: estadoOrden
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoOrden'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdenCompraDTO'
    post:
      tags: [Ordenes]
      summary: Crear orden de compra
      operationId: crearOrden
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenCompraCreateDTO'
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'

  /ordenes/{id}:
    get:
      tags: [Ordenes]
      summary: Obtener orden de compra por id
      operationId: obtenerOrden
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
        '404':
          description: No encontrado

  /ordenes/{id}/estado:
    patch:
      tags: [Ordenes]
      summary: Actualizar el estado de una orden
      operationId: actualizarEstadoOrden
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenCompraEstadoUpdateDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
        '404':
          description: No encontrado

  /ordenes/{idOrden}/detalles:
    get:
      tags: [Ordenes]
      summary: Listar detalles de una orden de compra
      operationId: listarDetallesOrden
      parameters:
        - name: idOrden
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetalleOrdenCompraDTO'
    post:
      tags: [Ordenes]
      summary: Agregar detalle a una orden de compra
      operationId: crearDetalleOrden
      parameters:
        - name: idOrden
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetalleOrdenCompraCreateDTO'
      responses:
        '201':
          description: Detalle creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleOrdenCompraDTO'

  # MS3 - INTERCAMBIOS
  /intercambios:
    get:
      tags: [ Intercambios ]
      summary: Listar intercambios
      operationId: listarIntercambios
      parameters:
        - name: idUsuario
          in: query
          required: false
          description: Filtra por usuario proponente o receptor
          schema:
            type: integer
            format: int64

        - name: estado
          in: query
          required: false
          description: Filtra por estado del intercambio
          schema:
            $ref: '#/components/schemas/EstadoIntercambio'

        - name: page
          in: query
          required: false
          description: Número de página, comenzando en 0
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          required: false
          description: Cantidad de elementos por página
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Página de intercambios
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/IntercambioPageDTO'

    post:
      tags: [Intercambios]
      summary: Proponer un intercambio
      operationId: crearIntercambio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntercambioCreateDTO'
      responses:
        '201':
          description: Intercambio creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'

  /intercambios/{id}:
    get:
      tags: [ Intercambios ]
      summary: Obtener intercambio por id
      operationId: obtenerIntercambio
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'
        '404':
          description: No encontrado
    put:
      tags: [ Intercambios ]
      summary: Actualizar intercambio
      operationId: actualizarIntercambio
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntercambioUpdateDTO'
      responses:
        '200':
          description: Intercambio actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'
        '404':
          description: No encontrado
    delete:
      tags: [ Intercambios ]
      summary: Eliminar lógicamente un intercambio
      operationId: eliminarIntercambio
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Intercambio eliminado lógicamente
        '404':
          description: No encontrado

  /intercambios/{id}/estado:
    patch:
      tags: [Intercambios]
      summary: Actualizar el estado de un intercambio
      operationId: actualizarEstadoIntercambio
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntercambioEstadoUpdateDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercambioDTO'
        '404':
          description: No encontrado

  /intercambios/{idIntercambio}/detalles:
    get:
      tags: [Intercambios]
      summary: Listar detalles de un intercambio
      operationId: listarDetallesIntercambio
      parameters:
        - name: idIntercambio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetalleIntercambioDTO'

  /tickets-soporte:
    get:
      tags: [ Soporte ]
      summary: Listar tickets de soporte
      operationId: listarTicketsSoporte
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página, comenzando en 0
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          required: false
          description: Cantidad de elementos por página
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: OK

    post:
      tags: [ Soporte ]
      summary: Crear ticket de soporte
      operationId: crearTicketSoporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketSoporteCreateDTO'
      responses:
        '201':
          description: Ticket de soporte creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSoporteDTO'

  /reclamos:
    get:
      tags: [ Reclamos ]
      summary: Listar reclamos (paginado, con filtros opcionales)
      operationId: listarReclamos
      parameters:
        - name: idOrden
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: idComprador
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: tipoReclamo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoReclamo'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoReclamo'
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamoPageDTO'
    post:
      tags: [ Reclamos ]
      summary: Crear reclamo
      operationId: crearReclamo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReclamoCreateDTO'
      responses:
        '201':
          description: Reclamo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamoDTO'

  /reclamos/{id}:
    get:
      tags: [ Reclamos ]
      summary: Obtener reclamo por id
      operationId: obtenerReclamo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamoDTO'
        '404':
          description: No encontrado
    put:
      tags: [ Reclamos ]
      summary: Actualizar reclamo
      operationId: actualizarReclamo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReclamoUpdateDTO'
      responses:
        '200':
          description: Reclamo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamoDTO'
    delete:
      tags: [ Reclamos ]
      summary: Borrado logico del reclamo (activo = false)
      operationId: eliminarReclamo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Reclamo dado de baja

components:

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    PageQuery:
      name: page
      in: query
      required: false
      description: Número de página, comenzando en 0
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      required: false
      description: Cantidad de elementos por página
      schema:
        type: integer
        minimum: 1
        default: 20

  schemas:

    # ROL
    RolDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipoRol:
          type: string
          enum: [COMPRADOR, VENDEDOR, ADMIN]
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    RolCreateDTO:
      type: object
      required: [tipoRol]
      properties:
        tipoRol:
          type: string
          enum: [COMPRADOR, VENDEDOR, ADMIN]

    # USUARIO
    UsuarioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        estado:
          type: string
          enum: [ACTIVO, SUSPENDIDO, PENDIENTE_VERIFICACION, RECHAZADO]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    UsuarioCreateDTO:
      type: object
      required: [email, password, idRoles]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        password:
          type: string
          minLength: 8
          maxLength: 255
        idRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64

    UsuarioUpdateDTO:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          minLength: 8
          maxLength: 255
        estado:
          type: string
          enum: [ACTIVO, SUSPENDIDO, PENDIENTE_VERIFICACION, RECHAZADO]
        idRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64

    UsuarioPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    LoginDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        password:
          type: string
          minLength: 1
          maxLength: 255

    TokenDTO:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer

    ValidarTokenDTO:
      type: object
      required: [token]
      properties:
        token:
          type: string

    # PERFIL USUARIO
    PerfilUsuarioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idUsuario:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccionEnvio:
          type: string

    PerfilUsuarioCreateDTO:
      type: object
      required: [ idUsuario, nombre, apellido ]
      properties:
        idUsuario:
          type: integer
          format: int64
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellido:
          type: string
          minLength: 1
          maxLength: 100
        telefono:
          type: string
          maxLength: 20
        direccionEnvio:
          type: string
          maxLength: 255

    PerfilUsuarioUpdateDTO:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellido:
          type: string
          minLength: 1
          maxLength: 100
        telefono:
          type: string
          maxLength: 20
        direccionEnvio:
          type: string
          maxLength: 255

    # PRODUCTO
    ProductoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idVendedor:
          type: integer
          format: int64
        nombre:
          type: string
        categoria:
          type: string
        estadoConservacion:
          type: string
        rareza:
          type: string
        stock:
          type: integer
        precioReferencia:
          type: number
          format: double
        urlImagen:
          type: string
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    ProductoCreateDTO:
      type: object
      required: [idVendedor, nombre, precioReferencia]
      properties:
        idVendedor:
          type: integer
          format: int64
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        categoria:
          type: string
          maxLength: 100
        estadoConservacion:
          type: string
          maxLength: 50
        rareza:
          type: string
          maxLength: 50
        stock:
          type: integer
          minimum: 0
        precioReferencia:
          type: number
          format: double
          minimum: 0
        urlImagen:
          type: string
          maxLength: 500

    ProductoUpdateDTO:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        categoria:
          type: string
          maxLength: 100
        estadoConservacion:
          type: string
          maxLength: 50
        rareza:
          type: string
          maxLength: 50
        stock:
          type: integer
          minimum: 0
        precioReferencia:
          type: number
          format: double
          minimum: 0
        urlImagen:
          type: string
          maxLength: 500

    ProductoPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductoDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    # PUBLICACION
    EstadoPublicacion:
      type: string
      enum: [ACTIVA, PAUSADA, VENDIDA, CANCELADA]

    TipoVenta:
      type: string
      enum: [PRECIO_FIJO, OFERTA_LIBRE]

    PublicacionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idVendedor:
          type: integer
          format: int64
        titulo:
          type: string
        descripcion:
          type: string
        tipoVenta:
          $ref: '#/components/schemas/TipoVenta'
        estadoPublicacion:
          $ref: '#/components/schemas/EstadoPublicacion'
        fechaPublicacion:
          type: string
          format: date-time
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetallePublicacionDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    PublicacionCreateDTO:
      type: object
      required: [idVendedor, titulo, tipoVenta, detalles]
      properties:
        idVendedor:
          type: integer
          format: int64
        titulo:
          type: string
          minLength: 1
          maxLength: 255
        descripcion:
          type: string
        tipoVenta:
          $ref: '#/components/schemas/TipoVenta'
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetallePublicacionCreateDTO'

    PublicacionUpdateDTO:
      type: object
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 255
        descripcion:
          type: string
        tipoVenta:
          $ref: '#/components/schemas/TipoVenta'
        detalles:
          type: array
          description: Si se omite, los detalles no cambian. Una lista vacia los elimina todos.
          items:
            $ref: '#/components/schemas/DetallePublicacionCreateDTO'

    PublicacionEstadoUpdateDTO:
      type: object
      required: [estadoPublicacion]
      properties:
        estadoPublicacion:
          $ref: '#/components/schemas/EstadoPublicacion'

    PublicacionPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PublicacionDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    # DETALLE PUBLICACION
    DetallePublicacionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        producto:
          $ref: '#/components/schemas/ProductoDTO'
        precioUnitario:
          type: number
          format: double
        cantidadPublicada:
          type: integer

    DetallePublicacionCreateDTO:
      type: object
      required: [idProducto, precioUnitario, cantidadPublicada]
      properties:
        idProducto:
          type: integer
          format: int64
        precioUnitario:
          type: number
          format: double
          minimum: 0
        cantidadPublicada:
          type: integer
          minimum: 1

    DetallePublicacionPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DetallePublicacionDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    # OFERTA
    EstadoOferta:
      type: string
      enum: [PENDIENTE, ACEPTADA, RECHAZADA, EXPIRADA]

    OfertaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        montoOfertado:
          type: number
          format: double
        estadoOferta:
          $ref: '#/components/schemas/EstadoOferta'
        fechaOferta:
          type: string
          format: date-time
        fechaRespuesta:
          type: string
          format: date-time

    OfertaCreateDTO:
      type: object
      required: [idPublicacion, idComprador, montoOfertado]
      properties:
        idPublicacion:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        montoOfertado:
          type: number
          format: double
          minimum: 0

    OfertaUpdateDTO:
      type: object
      properties:
        montoOfertado:
          type: number
          format: double
          minimum: 0

    OfertaPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OfertaDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
    # MS2 - ORDEN DE COMPRA

    EstadoOrden:
      type: string
      enum: [PENDIENTE, PAGADA, ENVIADA, ENTREGADA, CANCELADA]

    MetodoPago:
      type: string
      enum: [TARJETA, EFECTIVO, TRANSFERENCIA]

    OrdenCompraDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        fechaOrden:
          type: string
          format: date-time
        estadoOrden:
          $ref: '#/components/schemas/EstadoOrden'
        montoSubtotal:
          type: number
          format: double
        costoEnvio:
          type: number
          format: double
        montoTotal:
          type: number
          format: double
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleOrdenCompraDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    OrdenCompraCreateDTO:
      type: object
      required: [idComprador, metodoPago, detalles]
      properties:
        idComprador:
          type: integer
          format: int64
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'
        costoEnvio:
          type: number
          format: double
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleOrdenCompraCreateDTO'

    OrdenCompraEstadoUpdateDTO:
      type: object
      required: [estadoOrden]
      properties:
        estadoOrden:
          $ref: '#/components/schemas/EstadoOrden'

    # DETALLE ORDEN DE COMPRA
    DetalleOrdenCompraDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idOrden:
          type: integer
          format: int64
        idProducto:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        nombreProductoSnapshot:
          type: string
        cantidad:
          type: integer
        precioUnitarioHistorico:
          type: number
          format: double
        subtotalItem:
          type: number
          format: double

    DetalleOrdenCompraCreateDTO:
      type: object
      required: [idProducto, idPublicacion, cantidad]
      properties:
        idProducto:
          type: integer
          format: int64
        idPublicacion:
          type: integer
          format: int64
        cantidad:
          type: integer
          minimum: 1

    # MS3 - INTERCAMBIO

    EstadoIntercambio:
      type: string
      enum: [PROPUESTO, ACEPTADO, RECHAZADO, CANCELADO, COMPLETADO]

    TipoMovimientoIntercambio:
      type: string
      enum: [OFRECIDO, SOLICITADO]

    IntercambioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idUsuarioProponente:
          type: integer
          format: int64
        idUsuarioReceptor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoIntercambio'
        diferenciaDinero:
          type: number
          format: double
        usuarioPagaDiferencia:
          type: integer
          format: int64
        activo:
          type: boolean
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleIntercambioDTO'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    IntercambioPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/IntercambioDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    IntercambioCreateDTO:
      type: object
      required: [idUsuarioProponente, idUsuarioReceptor, detalles]
      properties:
        idUsuarioProponente:
          type: integer
          format: int64
        idUsuarioReceptor:
          type: integer
          format: int64
        diferenciaDinero:
          type: number
          format: double
        usuarioPagaDiferencia:
          type: integer
          format: int64
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleIntercambioCreateDTO'

    IntercambioUpdateDTO:
      type: object
      required:
        - idUsuarioProponente
        - idUsuarioReceptor
        - detalles
      properties:
        idUsuarioProponente:
          type: integer
          format: int64

        idUsuarioReceptor:
          type: integer
          format: int64

        diferenciaDinero:
          type: number
          format: double

        usuarioPagaDiferencia:
          type: integer
          format: int64

        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleIntercambioCreateDTO'

    IntercambioEstadoUpdateDTO:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoIntercambio'

    # DETALLE INTERCAMBIO
    DetalleIntercambioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idIntercambio:
          type: integer
          format: int64
        idProducto:
          type: integer
          format: int64
        nombreProductoSnapshot:
          type: string
        cantidad:
          type: integer
        tipoMovimiento:
          $ref: '#/components/schemas/TipoMovimientoIntercambio'

    DetalleIntercambioCreateDTO:
      type: object
      required: [idProducto, cantidad, tipoMovimiento]
      properties:
        idProducto:
          type: integer
          format: int64
        cantidad:
          type: integer
          minimum: 1
        tipoMovimiento:
          $ref: '#/components/schemas/TipoMovimientoIntercambio'


    # TICKET SOPORTE
    TicketSoporteDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        email:
          type: string
        asunto:
          type: string
        mensaje:
          type: string
        fechaEnvio:
          type: string
          format: date-time

    TicketSoporteCreateDTO:
      type: object
      required: [ nombre, email, asunto, mensaje ]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
        asunto:
          type: string
          minLength: 1
          maxLength: 200
        mensaje:
          type: string
          minLength: 1
          maxLength: 2000

    # RECLAMO
    TipoReclamo:
      type: string
      enum: [PRODUCTO_DANADO, PRODUCTO_NO_RECIBIDO, COBRO_INCORRECTO, OTRO]

    EstadoReclamo:
      type: string
      enum: [ABIERTO, EN_REVISION, RESUELTO, RECHAZADO]

    ReclamoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idOrden:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        tipoReclamo:
          $ref: '#/components/schemas/TipoReclamo'
        descripcion:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoReclamo'
        respuesta:
          type: string
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    ReclamoPageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReclamoDTO'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ReclamoCreateDTO:
      type: object
      required: [idOrden, idComprador, tipoReclamo, descripcion]
      properties:
        idOrden:
          type: integer
          format: int64
        idComprador:
          type: integer
          format: int64
        tipoReclamo:
          $ref: '#/components/schemas/TipoReclamo'
        descripcion:
          type: string
          minLength: 1
          maxLength: 1000

    ReclamoUpdateDTO:
      type: object
      properties:
        tipoReclamo:
          $ref: '#/components/schemas/TipoReclamo'
        descripcion:
          type: string
          minLength: 1
