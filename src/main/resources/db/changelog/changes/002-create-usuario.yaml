databaseChangeLog:
  - changeSet:
      id: 002-create-usuario
      author: equipo
      changes:
        - createTable:
            tableName: usuario
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: id_rol, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_usuario_rol, references: rol(id)}}
              - column: {name: email, type: VARCHAR(150), constraints: {nullable: false, unique: true}}
              - column: {name: password, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: nombre, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: apellido, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: telefono, type: VARCHAR(30)}
              - column: {name: direccion_envio, type: VARCHAR(255)}
              - column: {name: estado, type: VARCHAR(30)}
              - column: {name: fecha_creacion, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_actualizacion, type: TIMESTAMP}
