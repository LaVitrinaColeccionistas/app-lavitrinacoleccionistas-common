databaseChangeLog:
  - changeSet:
      id: 017-create-reclamo
      author: equipo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: reclamo
      changes:
        - createTable:
            tableName: reclamo
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: id_orden, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_reclamo_orden, references: orden_compra(id)}}
              - column: {name: id_comprador, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_reclamo_comprador, references: usuario(id)}}
              - column: {name: tipo_reclamo, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: descripcion, type: VARCHAR(1000), constraints: {nullable: false}}
              - column: {name: estado, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: respuesta, type: VARCHAR(1000)}
              - column: {name: activo, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: fecha_creacion, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_actualizacion, type: TIMESTAMP}
